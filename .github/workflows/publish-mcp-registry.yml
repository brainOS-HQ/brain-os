name: Publish to MCP Registry

# Manual only. Run it from the Actions tab, on main, after the matching
# version is on npm. It never runs on push, pull request or tag.
on:
  workflow_dispatch:

# Read-only by default; the one job below adds the OIDC scope it needs.
permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    # Only main may publish, so the entry always comes from reviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry; no stored token
    env:
      # Pinned. To upgrade, change the version and the checksum together.
      # The checksum is the sha256 of mcp-publisher_linux_amd64.tar.gz on the
      # release page for that version.
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check server.json matches the npm release
        run: |
          set -euo pipefail
          name="$(jq -r '.name' server.json)"
          version="$(jq -r '.version' server.json)"
          package_version="$(jq -r '.packages[0].version' server.json)"
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          if [ "$version" != "$package_version" ] || [ "$version" != "$(jq -r '.version' package.json)" ]; then
            echo "server.json and package.json versions differ" >&2
            exit 1
          fi
          published="$(curl --fail --silent --show-error "https://registry.npmjs.org/${identifier}/${version}" | jq -r '.mcpName')"
          if [ "$published" != "$name" ]; then
            echo "npm ${identifier}@${version} has mcpName '${published}', expected '${name}'" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
